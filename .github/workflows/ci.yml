name: Backend CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  test:
    name: Build and Test (Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare Gradle wrapper
        run: chmod +x ./gradlew

      - name: Run unit tests with retry
        shell: bash
        run: |
          set -euo pipefail
          ATTEMPTS=3
          for i in $(seq 1 "$ATTEMPTS"); do
            echo "Attempt $i/$ATTEMPTS"
            if ./gradlew --no-daemon test --stacktrace; then
              exit 0
            fi
            if [ "$i" -lt "$ATTEMPTS" ]; then
              echo "Gradle test failed, retry in 20s..."
              sleep 20
            fi
          done
          echo "Gradle test failed after $ATTEMPTS attempts"
          exit 1

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
          if-no-files-found: warn
